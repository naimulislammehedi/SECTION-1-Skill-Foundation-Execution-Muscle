<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accessible Page</title>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="#form">Form</a></li>
                <li><a href="#info">Info</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="info">
            <h2>Why Accessibility Matters</h2>
            <p>Accessible websites work for everyone.</p>
            <img src="./images.png" alt="Customer support team working together">
        </section>

        <section id="form">
            <h2>Contact Form</h2>

            <form>
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name">
                    <br><br>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email">
                </fieldset>
                <br>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>

</body>

</html>
