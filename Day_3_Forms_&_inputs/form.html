<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comprehensive HTML Form</title>
</head>
<body>

<header>
    <h1>Registration Portal</h1>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Register</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <form action="#" method="post">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="fullname">Full Name</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <p>
                <label for="email">Email Address</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="phone">Phone Number</label><br>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>
                <label for="dob">Date of Birth</label><br>
                <input type="date" id="dob" name="dob">
            </p>
        </fieldset>

        <!-- Account Details -->
        <fieldset>
            <legend>Account Details</legend>

            <p>
                <label for="username">Username</label><br>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </p>

            <p>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </p>

            <p>
                <label for="confirm-password">Confirm Password</label><br>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
            </p>
        </fieldset>

        <!-- Preferences -->
        <fieldset>
            <legend>Preferences</legend>

            <p>Gender</p>
            <p>
                <input type="radio" id="gender-male" name="gender" value="male">
                <label for="gender-male">Male</label><br>

                <input type="radio" id="gender-female" name="gender" value="female">
                <label for="gender-female">Female</label><br>

                <input type="radio" id="gender-other" name="gender" value="other">
                <label for="gender-other">Other</label>
            </p>

            <p>Skills</p>
            <p>
                <input type="checkbox" id="skill-html" name="skills" value="html">
                <label for="skill-html">HTML</label><br>

                <input type="checkbox" id="skill-css" name="skills" value="css">
                <label for="skill-css">CSS</label><br>

                <input type="checkbox" id="skill-js" name="skills" value="javascript">
                <label for="skill-js">JavaScript</label>
            </p>

            <p>
                <label for="country">Country</label><br>
                <select id="country" name="country">
                    <option value="">Select your country</option>
                    <option value="bangladesh">Bangladesh</option>
                    <option value="qatar">Qatar</option>
                    <option value="india">India</option>
                    <option value="other">Other</option>
                </select>
            </p>
        </fieldset>

        <!-- Feedback -->
        <fieldset>
            <legend>Feedback</legend>

            <p>
                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="4" cols="40"></textarea>
            </p>

            <p>
                <label for="experience">Experience Level</label><br>
                <input type="range" id="experience" name="experience" min="0" max="10">
            </p>

            <p>
                <label for="resume">Upload Resume</label><br>
                <input type="file" id="resume" name="resume">
            </p>
        </fieldset>

        <!-- Form Controls -->
        <p>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </p>

    </form>
</main>

<footer>
    <p>&copy; 2026 Registration Portal</p>
</footer>

</body>
</html>
